name: Windows offline checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python offline_tests.py
      - run: python app.py --demo --smoke-test
