name: Build Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Check tag matches package version
        shell: pwsh
        run: |
          $expected = python -c "from package_release import VERSION; print('v' + VERSION)"
          if ($env:GITHUB_REF_NAME -ne $expected) { throw 'Tag and package version differ' }
      - run: python -m pip install -r requirements-build.txt
      - run: python build_exe.py
      - name: Package verified build
        shell: pwsh
        run: |
          $reportPath = Get-ChildItem build/exe-*/build-report.json | Sort-Object LastWriteTime | Select-Object -Last 1
          $report = Get-Content $reportPath.FullName -Raw | ConvertFrom-Json
          if ($report.status -ne 'passed') { throw 'Build did not pass' }
          python package_release.py --exe $report.executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python verify_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "平安签到 $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:GITHUB_REF_NAME releases/CSUFT-Pingan.exe releases/*-windows-x64.zip releases/*-source.zip releases/checksums.json releases/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
